apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-node-autodelete
  labels:
    app.kubernetes.io/name: kube-node-autodelete
    app.kubernetes.io/component: controller
rules:
# Node cordon / delete
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch", "patch", "delete"]

# Pod listing for drain
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

# Eviction API (drain 핵심)
- apiGroups: ["policy"]
  resources: ["evictions"]
  verbs: ["create"]
