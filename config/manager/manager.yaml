apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-node-autodelete
  labels:
    app.kubernetes.io/name: kube-node-autodelete
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: kube-node-autodelete
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-node-autodelete
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: kube-node-autodelete
    spec:
      serviceAccountName: kube-node-autodelete
      terminationGracePeriodSeconds: 10

      securityContext:
        runAsNonRoot: true

      containers:
      - name: manager
        image: example.com/open/kube-node-autodelete:dev_0.0.4
        imagePullPolicy: IfNotPresent

        command:
        - /manager
        args:
        - --leader-elect=true
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081

        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 65532        # distroless nonroot
          capabilities:
            drop: ["ALL"]

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20

        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi