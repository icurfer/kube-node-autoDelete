name: Verify and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22.12'
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.17.3
      - name: Check release versions
        run: |
          python3 scripts/check-versions.py
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat version)"
          fi
      - name: Test and build
        run: |
          go test ./...
          go build ./...
      - uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: v1.59.1
      - name: Validate chart
        run: |
          helm lint ./helm
          helm template kube-node-autodelete ./helm --namespace kube-node-autodelete-system > /tmp/rendered.yaml
      - name: Build container
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" --build-arg VERSION="$(cat version)" -t kube-node-autodelete:check .

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Image metadata
        id: image
        run: |
          echo "version=$(cat version)" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kube-node-autodelete" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.repository }}:sha-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.image.outputs.version }}
      - name: Record image digest
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          VERSION: ${{ steps.image.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Image `%s:%s`\n\nDigest `%s`\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
