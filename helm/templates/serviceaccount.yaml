{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-node-autodelete.serviceAccountName" . }}
  namespace: {{ include "kube-node-autodelete.namespace" . }}
  labels:
    app.kubernetes.io/component: controller
    {{- include "kube-node-autodelete.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
